name: Build AppImage

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Fix line endings
        run: sed -i 's/\r$//' build_appimage.sh

      - name: Build AppImage
        run: bash build_appimage.sh

      - name: Save finished AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LinuxTweaker-AppImage
          path: LinuxTweaker-x86_64.AppImage
